<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>堆叠测试</title>
</head>
<body>
<h1>堆叠逻辑测试</h1>
<div id="output"></div>

<script>
// 简化版测试
const totalCards = 36;
const maxLayers = 3;
const boardWidth = 480;
const boardHeight = 400;
const cardWidth = 60;
const cardHeight = 60;

function generateBasePositions(totalCards, maxLayers) {
    const avgStackHeight = 2 + Math.floor(maxLayers / 2);
    const positionCount = Math.ceil(totalCards / avgStackHeight);
    
    const positions = [];
    const centerX = boardWidth / 2;
    const centerY = boardHeight / 2;
    const maxRadius = Math.min(boardWidth, boardHeight) / 2 - cardWidth;
    
    for (let i = 0; i < positionCount; i++) {
        const angle = (i / positionCount) * Math.PI * 2 * 2.5;
        const radius = Math.sqrt(i / positionCount) * maxRadius;
        
        const x = centerX + Math.cos(angle) * radius - cardWidth / 2;
        const y = centerY + Math.sin(angle) * radius - cardHeight / 2;
        
        const clampedX = Math.max(10, Math.min(x, boardWidth - cardWidth - 10));
        const clampedY = Math.max(10, Math.min(y, boardHeight - cardHeight - 10));
        
        const layers = Math.max(1, Math.min(maxLayers, Math.floor(Math.random() * maxLayers) + 1));
        
        positions.push({ x: clampedX, y: clampedY, layers: layers });
    }
    
    return positions;
}

const basePositions = generateBasePositions(totalCards, maxLayers);
console.log('基础位置数:', basePositions.length);
console.log('基础位置详情:', basePositions);

const cards = [];
let cardIndex = 0;
for (const pos of basePositions) {
    for (let l = 0; l < pos.layers && cardIndex < totalCards; l++) {
        cards.push({
            x: Math.round(pos.x + (l * 5)),
            y: Math.round(pos.y - (l * 5)),
            layer: l
        });
        cardIndex++;
    }
}

while (cardIndex < totalCards) {
    const randomPos = basePositions[Math.floor(Math.random() * basePositions.length)];
    const newLayer = randomPos.layers;
    cards.push({
        x: Math.round(randomPos.x + (newLayer * 5)),
        y: Math.round(randomPos.y - (newLayer * 5)),
        layer: newLayer
    });
    randomPos.layers++;
    cardIndex++;
}

// 统计
const positionGroups = {};
for (const card of cards) {
    const key = `${card.x},${card.y}`;
    positionGroups[key] = (positionGroups[key] || 0) + 1;
}

const stackHeights = Object.values(positionGroups);
const maxStack = Math.max(...stackHeights);
const minStack = Math.min(...stackHeights);

document.getElementById('output').innerHTML = `
    <p>总牌数：${cards.length}</p>
    <p>基础位置数：${basePositions.length}</p>
    <p>堆数：${Object.keys(positionGroups).length}</p>
    <p>最大堆高：${maxStack}</p>
    <p>最小堆高：${minStack}</p>
    <h3>前 20 张牌坐标:</h3>
    <pre>${cards.slice(0, 20).map((c, i) => `[${i}] x=${c.x}, y=${c.y}, layer=${c.layer}`).join('\n')}</pre>
    <h3>所有堆叠位置:</h3>
    <pre>${Object.entries(positionGroups).map(([k, v]) => `${k}: ${v}张`).join('\n')}</pre>
`;
</script>
</body>
</html>
