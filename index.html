<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸 - 萌萌消</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">🌻 植物大战僵尸 - 萌萌消 🧟</div>
            <div class="stats">
                <div class="stat-item"><span class="stat-label">关卡:</span><span class="stat-value" id="level">1</span></div>
                <div class="stat-item"><span class="stat-label">剩余:</span><span class="stat-value" id="remaining">0</span></div>
                <div class="stat-item"><span class="stat-label">分数:</span><span class="stat-value" id="score">0</span></div>
                <div class="stat-item"><span class="stat-label">时间:</span><span class="stat-value" id="timer">09:00</span></div>
            </div>
            <div class="controls">
                <button id="pauseBtn">⏸️</button>
                <button id="shuffleBtn">🔄</button>
                <button id="undoBtn">↩️</button>
                <button id="newGameBtn" class="danger">🎮</button>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <div class="layer-indicator">层:<span id="layerCount">0</span></div>
        </div>
        
        <div class="hand-area">
            <div class="hand-title">🎒 卡槽</div>
            <div class="hand-slots" id="handSlots"></div>
        </div>
    </div>
    
    <div class="message-overlay" id="winMessage">
        <div class="message-box">
            <h2>🎉 恭喜！🎉</h2>
            <p>分数：<span id="finalScoreWin">0</span></p>
            <div class="buttons">
                <button onclick="game.nextLevel()">下一关</button>
                <button onclick="game.newGame()">新游戏</button>
            </div>
        </div>
    </div>
    
    <div class="message-overlay" id="loseMessage">
        <div class="message-box">
            <h2>💀 游戏结束 💀</h2>
            <p id="loseReason"></p>
            <div class="buttons">
                <button onclick="game.restartLevel()">重试</button>
                <button onclick="game.newGame()">新游戏</button>
            </div>
        </div>
    </div>

    <script src="game.js?v=2026030829"></script>
</body>
</html>
